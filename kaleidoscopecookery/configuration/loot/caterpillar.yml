loot_sources:
  #生菜掉猪儿虫
  kaleidoscopecookery:lettuce_caterpillar:
    type: block_break
    target:
      - kaleidoscopecookery:lettuce_crop
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: random
              value: 0.12
          entries:
            - type: item
              item: kaleidoscopecookery:caterpillar
              functions:
                - type: apply_bonus
                  enchantment: minecraft:fortune
                  formula:
                    type: uniform_bonus_count
                    multiplier: 1
