loot_sources:
  # 驴和骡掉落驴肉
  kaleidoscopecookery:donkey_raw_meat:
    type: entity_death
    target:
      - minecraft:donkey
      - minecraft:mule
    loot:
      pools:
        - rolls: 1
          entries:
            - type: item
              item: kaleidoscopecookery:raw_donkey_meat
              conditions:
                - type: inverted
                  terms:
                    - type: kaleidoscopecookery:entity_properties
                      predicate:
                        flags:
                          is_on_fire: true
              functions:
                - type: set_count
                  count:
                    type: uniform
                    min: 1
                    max: 3
                - type: apply_bonus
                  enchantment: minecraft:looting
                  formula:
                    type: kaleidoscopecookery:uniform_bonus_count
                    multiplier: 1
            - type: item
              item: kaleidoscopecookery:cooked_donkey_meat
              conditions:
                - type: kaleidoscopecookery:entity_properties
                  predicate:
                    flags:
                      is_on_fire: true
              functions:
                - type: set_count
                  count:
                    type: uniform
                    min: 1
                    max: 3
                - type: apply_bonus
                  enchantment: minecraft:looting
                  formula:
                    type: kaleidoscopecookery:uniform_bonus_count
                    multiplier: 1
