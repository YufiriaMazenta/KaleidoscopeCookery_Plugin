config_factory#crop_seeds:
  instances:
    #番茄种子
    - id: tomato_seed
      crop: kaleidoscopecookery:tomato_crop
    #辣椒种子
    - id: chili_seed
      crop: kaleidoscopecookery:chili_crop
    #生菜种子
    - id: lettuce_seed
      crop: kaleidoscopecookery:lettuce_crop
  blueprint:
    items:
      #作物种子
      kaleidoscopecookery:${id}:
        template: kaleidoscopecookery:item/plain
        arguments:
          material: minecraft:nether_brick
          texture: "${id}"
        behavior:
          type: block_item
          block: "${crop}"
        lore:
          - "<!i><gray><lang:lore.kaleidoscopecookery.crop_seed>"

config_factory#hanging_string_displays:
  instances:
    #辣椒串串
    - block: chili_ristra
    #蘑菇串串
    - block: strung_mushrooms
  blueprint:
    items:
      #悬挂串头节展示模型
      show:${block}_head:
        template: kaleidoscopecookery:display/model
        arguments:
          name: ${block}
          path: "minecraft:block/custom/cook/block/${block}/head"
      #悬挂串采摘后头节展示模型
      show:${block}_head_sheared:
        template: kaleidoscopecookery:display/model
        arguments:
          name: ${block}
          path: "minecraft:block/custom/cook/block/${block}/head_sheared"
      #悬挂串身节展示模型
      show:${block}_body:
        template: kaleidoscopecookery:display/model
        arguments:
          name: ${block}
          path: "minecraft:block/custom/cook/block/${block}/body"
      #悬挂串采摘后身节展示模型
      show:${block}_body_sheared:
        template: kaleidoscopecookery:display/model
        arguments:
          name: ${block}
          path: "minecraft:block/custom/cook/block/${block}/body_sheared"
