equipments:
  $$>=1.21.2:
    #农夫套装外观
    kaleidoscopecookery:farmer:
      type: component
      humanoid: minecraft:entity/equipment/humanoid/kaleidoscopecookery_farmer
      humanoid_leggings: minecraft:entity/equipment/humanoid_leggings/kaleidoscopecookery_farmer
  $$<1.21.2:
    #农夫套装外观
    kaleidoscopecookery:farmer:
      type: trim
      humanoid: minecraft:entity/equipment/humanoid/kaleidoscopecookery_farmer
      humanoid_leggings: minecraft:entity/equipment/humanoid_leggings/kaleidoscopecookery_farmer

templates:
  #悬挂串外观
  kaleidoscopecookery:appearance/hanging_string:
    state: minecraft:sugar_cane[age=13]
    transparent: true
    entity_renderer:
      item: "show:${item}"

items:
  #油脂块
  kaleidoscopecookery:oil_block:
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.oil_block>"
    model: minecraft:block/custom/cook/block/oil_block
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          template:
            - default:hardness/none
            - default:settings/transparent_1x1x1
          overrides:
            friction: 0.985
            map_color: ice
            sounds:
              break: minecraft:block.slime_block.break
              step: minecraft:block.slime_block.step
              place: minecraft:block.slime_block.place
              hit: minecraft:block.slime_block.hit
              fall: minecraft:block.slime_block.fall
        state:
          auto_state: solid
          texture: minecraft:block/custom/cook/block/oil_block

  #辣椒串串
  kaleidoscopecookery:chili_ristra:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.chili_ristra>"
    texture: minecraft:item/custom/cook/chili_ristra
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          template: kaleidoscopecookery:settings/hanging_string
        behaviors:
          - type: kaleidoscopecookery:hanging_string
            harvest_item: kaleidoscopecookery:red_chili
            harvest_amount: 3
        states:
          properties:
            is_head:
              type: boolean
              default: true
            sheared:
              type: boolean
              default: false
          appearances:
            head:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: chili_ristra_head
            head_sheared:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: chili_ristra_head_sheared
            body:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: chili_ristra_body
            body_sheared:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: chili_ristra_body_sheared
          variants:
            is_head=true,sheared=false:
              appearance: head
            is_head=true,sheared=true:
              appearance: head_sheared
            is_head=false,sheared=false:
              appearance: body
            is_head=false,sheared=true:
              appearance: body_sheared

  #蘑菇串串
  kaleidoscopecookery:strung_mushrooms:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.strung_mushrooms>"
    texture: minecraft:item/custom/cook/strung_mushrooms
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          template: kaleidoscopecookery:settings/hanging_string
          arguments:
            map_color: 26
        behaviors:
          - type: kaleidoscopecookery:hanging_string
            harvest_item: minecraft:brown_mushroom
            harvest_amount: 3
        states:
          properties:
            is_head:
              type: boolean
              default: true
            sheared:
              type: boolean
              default: false
          appearances:
            head:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: strung_mushrooms_head
            head_sheared:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: strung_mushrooms_head_sheared
            body:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: strung_mushrooms_body
            body_sheared:
              template: kaleidoscopecookery:appearance/hanging_string
              arguments:
                item: strung_mushrooms_body_sheared
          variants:
            is_head=true,sheared=false:
              appearance: head
            is_head=true,sheared=true:
              appearance: head_sheared
            is_head=false,sheared=false:
              appearance: body
            is_head=false,sheared=true:
              appearance: body_sheared

  #稻草捆
  kaleidoscopecookery:straw_block:
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.straw_block>"
    model: minecraft:block/custom/cook/block/straw_block
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          template:
            - default:sound/grass
            - default:settings/solid_1x1x1
          overrides:
            hardness: 1.0
            resistance: 0.5
            instrument: banjo
            map_color: yellow
            tags:
              - minecraft:mineable/hoe
        states:
          properties:
            axis:
              type: axis
              default: y
          appearances:
            axisY:
              auto_state: solid
              model:
                path: minecraft:block/custom/cook/block/straw_block
            axisX:
              auto_state: solid
              model:
                x: 90
                y: 90
                path: minecraft:block/custom/cook/block/straw_block_horizontal
            axisZ:
              auto_state: solid
              model:
                x: 90
                path: minecraft:block/custom/cook/block/straw_block_horizontal
          variants:
            axis=x:
              appearance: axisX
            axis=y:
              appearance: axisY
            axis=z:
              appearance: axisZ

  #稻草人
  kaleidoscopecookery:scarecrow:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.scarecrow>"
    texture: minecraft:item/custom/cook/scarecrow
    behavior:
      type: furniture_item
      furniture: kaleidoscopecookery:scarecrow
      rules:
        ground:
          rotation: eight
          alignment: CENTER
    lore:
      - "<!i><gray><lang:lore.kaleidoscopecookery.scarecrow>"

  #嬗变饭袋
  kaleidoscopecookery:transmutation_lunch_bag:
    material: minecraft:bundle
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.transmutation_lunch_bag>"
    texture: minecraft:item/custom/cook/transmutation_lunch_bag
    lore:
      - "<!i><gray><lang:lore.kaleidoscopecookery.config_only.storage_transmutation>"
    behavior:
      type: kaleidoscopecookery:transmutation_lunch_bag

  kaleidoscopecookery:transmutation_lunch_bag_eating:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.transmutation_lunch_bag>"
      components:
        minecraft:max_stack_size: 1
        minecraft:food:
          nutrition: 0
          saturation: 0
          can_always_eat: true
        minecraft:consumable:
          consume_seconds: 2.0
          animation: eat
          has_consume_particles: true
          sound: minecraft:entity.generic.eat
    texture: minecraft:item/custom/cook/transmutation_lunch_bag
    lore:
      - "<!i><gray><lang:lore.kaleidoscopecookery.config_only.storage_transmutation>"

  #镰刀
  kaleidoscopecookery:sickle:
    material: minecraft:iron_hoe
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.sickle>"
    behavior:
      type: kaleidoscopecookery:sickle_range_harvest
    texture: minecraft:item/custom/cook/sickle
    lore:
      - "<!i><gray><lang:lore.kaleidoscopecookery.config_only.crop_harvest>"

  #农夫围裙
  kaleidoscopecookery:farmer_chest_plate:
    template: kaleidoscopecookery:item/farmer_armor
    arguments:
      material: minecraft:chainmail_chestplate
      slot: chest
      max_damage: 240
      armor: 4

  #农夫长裤
  kaleidoscopecookery:farmer_leggings:
    template: kaleidoscopecookery:item/farmer_armor
    arguments:
      material: minecraft:chainmail_leggings
      slot: legs
      max_damage: 225
      armor: 5

  #农夫皮靴
  kaleidoscopecookery:farmer_boots:
    template: kaleidoscopecookery:item/farmer_armor
    arguments:
      material: minecraft:chainmail_boots
      slot: feet
      max_damage: 195
      armor: 2

  #稻米
  kaleidoscopecookery:rice:
    material: minecraft:nether_brick
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.rice>"
    texture: minecraft:item/custom/cook/rice
    behavior:
      type: block_item
      block: kaleidoscopecookery:rice_crop
    lore:
      - "<!i><gray><lang:lore.kaleidoscopecookery.crop_seed_paddy>"

  #野生稻米
  kaleidoscopecookery:wild_rice:
    material: minecraft:nether_brick
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.wild_rice>"
    texture: minecraft:item/custom/cook/wild_rice
    behavior:
      type: block_item
      block: kaleidoscopecookery:rice_crop
    lore:
      - "<!i><gray><lang:lore.kaleidoscopecookery.crop_seed_paddy>"

  #红辣椒
  kaleidoscopecookery:red_chili:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.red_chili>"
      components:
        minecraft:food:
          nutrition: 1
          saturation: 0
          can_always_eat: true
        minecraft:consumable:
          consume_seconds: 1.6
          animation: eat
    texture: minecraft:item/custom/cook/red_chili
    events:
      consume:
        - type: damage
          amount: 2
          damage_type: minecraft:magic

  #青辣椒
  kaleidoscopecookery:green_chili:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.green_chili>"
      components:
        minecraft:food:
          nutrition: 1
          saturation: 0
          can_always_eat: true
        minecraft:consumable:
          consume_seconds: 1.6
          animation: eat
    texture: minecraft:item/custom/cook/green_chili
    events:
      consume:
        - type: damage
          amount: 1
          damage_type: minecraft:magic

  #稻穗
  kaleidoscopecookery:rice_panicle:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.rice_panicle>"
    texture: minecraft:item/custom/cook/rice_panicle

  #面粉
  kaleidoscopecookery:flour:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.flour>"
    texture: minecraft:item/custom/cook/flour

  #裹馅面食
  kaleidoscopecookery:stuffed_dough_food:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.stuffed_dough_food>"
    texture: minecraft:item/custom/cook/stuffed_dough_food

  #生粽子
  kaleidoscopecookery:raw_zongzi:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.raw_zongzi>"
    texture: minecraft:item/custom/cook/raw_zongzi

  #冷切火腿片
  kaleidoscopecookery:cold_cut_ham_slices:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.cold_cut_ham_slices>"
    texture: minecraft:item/custom/cook/cold_cut_ham_slices

  #樱吹雪
  kaleidoscopecookery:sakura_fubuki:
    material: minecraft:paper
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.sakura_fubuki>"
      components:
        minecraft:food:
          nutrition: 1
          saturation: 0.6
          can_always_eat: true
        minecraft:consumable:
          consume_seconds: 1.6
          animation: drink
          sound: minecraft:item.honey_bottle.drink
    texture: minecraft:item/custom/cook/tea/sakura_fubuki

