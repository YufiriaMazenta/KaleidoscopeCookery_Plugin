templates:
  #菜板切割阶段配方
  kaleidoscopecookery:recipe/chopping_board_stage:
    material: minecraft:paper
    model:
      type: minecraft:model
      path: "minecraft:block/custom/cook/block/chopping_board/${mat}/${stage}"

  #菜板配方
  kaleidoscopecookery:recipe/chopping_board:
    require: "${require}"
    stage: 5
    values: "cb:block/custom/cook/block/chopping_board/${mat}"
    mode: single
    result: ${result}

  #菜板无过程模型配方
  kaleidoscopecookery:recipe/chopping_board_no_model:
    require: "${require}"
    stage: ${stage:-5}
    mode: ${mode:-single}
    result: ${result}

config_factory#chopping_board_stage_models:
  instances:
    - mat: cod
    - mat: cooked_chicken
    - mat: cooked_cod
    - mat: cooked_cow_offal
    - mat: cooked_lamb_chops
    - mat: cooked_pork_belly
    - mat: cooked_rabbit
    - mat: cooked_salmon
    - mat: raw_chicken
    - mat: raw_cow_offal
    - mat: raw_dough
    - mat: raw_lamb_chops
    - mat: raw_pork_belly
    - mat: raw_rabbit
    - mat: salmon
    - mat: sashimi
  blueprint:
    items:
      #菜板切割阶段模型
      cb:block/custom/cook/block/chopping_board/${mat}/0:
        template: kaleidoscopecookery:recipe/chopping_board_stage
        arguments:
          stage: 0
      #菜板切割阶段模型
      cb:block/custom/cook/block/chopping_board/${mat}/1:
        template: kaleidoscopecookery:recipe/chopping_board_stage
        arguments:
          stage: 1
      #菜板切割阶段模型
      cb:block/custom/cook/block/chopping_board/${mat}/2:
        template: kaleidoscopecookery:recipe/chopping_board_stage
        arguments:
          stage: 2
      #菜板切割阶段模型
      cb:block/custom/cook/block/chopping_board/${mat}/3:
        template: kaleidoscopecookery:recipe/chopping_board_stage
        arguments:
          stage: 3
      #菜板切割阶段模型
      cb:block/custom/cook/block/chopping_board/${mat}/4:
        template: kaleidoscopecookery:recipe/chopping_board_stage
        arguments:
          stage: 4

